apiVersion: v1
kind: ConfigMap
metadata:
  name: wellness-ai-config
  namespace: wellness-ai
data:
  APP_NAME: "Wellness AI Platform"
  ENVIRONMENT: "production"
  API_V1_PREFIX: "/api/v1"
  BACKEND_PORT: "8000"
  FRONTEND_PORT: "8501"
  POSTGRES_DB: "wellness_db"
  MONGODB_DB: "wellness_mongo"
  REDIS_DB: "0"
  NEO4J_DB: "neo4j"
  PROMETHEUS_PORT: "9090"
  GRAFANA_PORT: "3000"
  MLFLOW_PORT: "5000"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "*"
  ENABLE_EEG_ANALYSIS: "true"
  ENABLE_VOICE_ANALYSIS: "true"
  ENABLE_FOOD_RECOGNITION: "true"
  ENABLE_OCR: "true"
  ENABLE_AYURVEDA: "true"
  ENABLE_GRAPHRAG: "true"

version: '3.8'

services:
  # PostgreSQL Database (Structured Data)
  postgres:
    image: postgres:14-alpine
    container_name: wellness-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wellness_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellness_password}
      POSTGRES_DB: ${POSTGRES_DB:-wellness_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wellness_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellness-network

  # MongoDB (Unstructured Data)
  mongo:
    image: mongo:6
    container_name: wellness-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-wellness_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-wellness_password}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-wellness_mongo}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellness-network

  # Redis (Caching & Session Storage)
  redis:
    image: redis:7-alpine
    container_name: wellness-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellness-network

  # Neo4j (Knowledge Graph)
  neo4j:
    image: neo4j:5-community
    container_name: wellness-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-wellness_password}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellness-network

  # Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: wellness-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-wellness_user}:${POSTGRES_PASSWORD:-wellness_password}@postgres:5432/${POSTGRES_DB:-wellness_db}
      - MONGODB_URL=mongodb://${MONGODB_USER:-wellness_user}:${MONGODB_PASSWORD:-wellness_password}@mongo:27017/${MONGODB_DB:-wellness_mongo}
      - REDIS_HOST=redis
      - NEO4J_URI=bolt://neo4j:7687
      - ENVIRONMENT=development
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./knowledge_base:/app/knowledge_base
      - ./data:/app/data
    depends_on:
      - postgres
      - mongo
      - redis
      - neo4j
    networks:
      - wellness-network
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Streamlit)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: wellness-frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - backend
    networks:
      - wellness-network
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0

  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: wellness-mlflow
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${POSTGRES_USER:-wellness_user}:${POSTGRES_PASSWORD:-wellness_password}@postgres:5432/${POSTGRES_DB:-wellness_db}
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      - postgres
    networks:
      - wellness-network
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://${POSTGRES_USER:-wellness_user}:${POSTGRES_PASSWORD:-wellness_password}@postgres:5432/${POSTGRES_DB:-wellness_db} --default-artifact-root /mlflow/artifacts

  # Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: wellness-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - wellness-network

  # Grafana (Monitoring Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: wellness-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - wellness-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  mlflow_data:
  prometheus_data:
  grafana_data:

networks:
  wellness-network:
    driver: bridge
